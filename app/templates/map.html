<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #1a1a1b; /* Dark background */
        color: #ecf0f1; /* Light text */
        padding: 40px;
        text-align: center;
        margin: 0;
    }

    h1 { color: #bdc3c7; margin-bottom: 10px; }
    p { color: #7f8c8d; margin-bottom: 30px; }

    .nav-container {
        max-width: 1000px;
        margin: 0 auto 20px auto;
        display: flex;
        justify-content: flex-start;
    }

    .back-btn {
        text-decoration: none;
        color: #3498db;
        font-weight: 600;
        display: flex;
        align-items: center;
        transition: color 0.2s;
    }

    .back-btn::before { content: '←'; margin-right: 8px; font-size: 1.2em; }
    .back-btn:hover { color: #2980b9; }

    /* Toggle Navigation */
    .tab-container {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 30px;
    }

    .tab-btn {
        padding: 12px 25px;
        background: #2c2c2e;
        border: 1px solid #bdc3c7;
        color: #bdc3c7;
        cursor: pointer;
        border-radius: 8px;
        font-weight: 600;
        transition: all 0.3s ease;
    }

    .tab-btn:hover {
        background: #3a3a3c;
        border-color: #3498db;
    }

    .tab-btn.active {
        background: #3498db;
        color: white;
        border-color: #3498db;
        box-shadow: 0 0 10px rgba(52, 152, 219, 0.5);
    }

    /* Content Cards */
    .map-content {
        display: none; 
        text-align: center;
    }

    .map-content.active {
        display: block;
        animation: fadeIn 0.6s ease;
    }

    .map-card {
        background-color: #2c2c2e;
        border: 1px solid #3a3a3c;
        border-radius: 12px;
        padding: 20px;
        max-width: 900px;
        margin: 0 auto;
        box-shadow: 0 8px 16px rgba(0,0,0,0.4);
    }

    img {
        max-width: 100%;
        height: auto;
        border-radius: 4px;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="nav-container">
    <a href="{{ url_for('main.index') }}" class="back-btn">Back to Dashboard</a>
</div>

<h1>UK Population Tracker Maps</h1>
<p>Static visualisations generated via Matplotlib and Geopandas.</p>

<div class="tab-container">
    <button class="tab-btn active" onclick="showMap(event, 'pop')">Total Population</button>
    <button class="tab-btn" onclick="showMap(event, 'change')">Net Change</button>
    <button class="tab-btn" onclick="showMap(event, 'percent')">% Growth Rate</button>
</div>

<div id="pop" class="map-content active">
    <div class="map-card">
        <h3>Total Regional Population</h3>
        <img src="{{ url_for('static', filename='images/population_map.png') }}" alt="Population Map">
    </div>
</div>

<div id="change" class="map-content">
    <div class="map-card">
        <h3>Numerical Population Change</h3>
        <img src="{{ url_for('static', filename='images/population_change_map.png') }}" alt="Change Map">
    </div>
</div>

<div id="percent" class="map-content">
    <div class="map-card">
        <h3>Percentage Change by Region</h3>
        <img src="{{ url_for('static', filename='images/percentage_change_map.png') }}" alt="Percentage Change Map">
    </div>
</div>

<script>
    function showMap(evt, mapId) {
        var contents = document.getElementsByClassName("map-content");
        for (var i = 0; i < contents.length; i++) {
            contents[i].classList.remove("active");
        }

        var buttons = document.getElementsByClassName("tab-btn");
        for (var i = 0; i < buttons.length; i++) {
            buttons[i].classList.remove("active");
        }

        document.getElementById(mapId).classList.add("active");
        evt.currentTarget.classList.add("active");
    }
</script>
