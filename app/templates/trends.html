<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #1a1a1b;
        color: #ecf0f1;
        padding: 40px;
        margin: 0;
    }

    h1 { color: #2c3e50; text-align: center; margin-bottom: 30px;
    }

    /* Chart Container */
    .chart-container {
        background: #2c2c2e;
        padding: 15px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        margin-bottom: 40px;
        min-height: 450px;
    }

    /* Table Styling */
    table {
        width: 100%;
        border-collapse: collapse;
        background: #2c2c2e;
        border-radius: 12px;
        overflow: hidden; /* Rounds the table corners */
        margin-bottom: 60px; /* Adds space for the footer name */
    }

    th {
        background-color: #3498db;
        color: white;
        text-align: left;
        padding: 15px;
    }

    td {
        padding: 12px 15px;
        border-bottom: 1px solid #3a3a3c;
        color: #ecf0f1;
    }

    tr:nth-child(even) {
        background-color: #f2f2f2;
    }

    tr:hover {
        background-color: #ebf5fb; /* Subtle highlight on hover */
    }

    /* Color coding the % change */
    .positive { color: #27ae60; font-weight: bold; }
    .negative { color: #e74c3c; font-weight: bold; }

.nav-container {
    max-width: 1200px;
    margin: 0 auto 20px auto;
    display: flex;
    justify-content: flex-start;
}

.back-btn {
    text-decoration: none;
    color: #3498db;
    font-weight: 600;
    display: flex;
    align-items: center;
    transition: color 0.2s;
}

.back-btn:hover {
    color: #2980b9;
}

/* Optional: Add a small arrow icon via CSS */
.back-btn::before {
    content: '←';
    margin-right: 8px;
    font-size: 1.2em;
}
</style>

<div class="nav-container">
    <a href="{{ url_for('main.index') }}" class="back-btn">Back to Dashboard</a>
</div>

<h1>Population Trends</h1>

<div class="chart-container">
    {{ graph_html | safe }}
</div>

<hr>
<table>
  <tr>
    <th>Region</th>
    <th>Population</th>
    <th>Change</th>
    <th>% Change</th>
  </tr>

{% for row in summary %}
<tr>
    <td>{{ row.region_name }}</td>
    <td>{{ "{:,}".format(row.population) }}</td>
    <td>{{ "{:+,}".format(row.change) }}</td>
    <td class="{{ 'positive' if row.pct_change > 0 else 'negative' }}">
        {{ row.pct_change | round(2) }}%
    </td>
</tr>
{% endfor %}
</table>



<footer style="
    text-align: center;
    padding: 20px;
    margin-top: 50px;
    background-color: #2c2c2e;
    border-top: 1px solid #3a3a3c;

">

       GitHub Repository
    </a>
</footer>
